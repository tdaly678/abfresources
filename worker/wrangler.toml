name = "abf-email-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cron trigger: every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Environment variables set via:
#   wrangler secret put AIRTABLE_TOKEN
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put SESSION_SECRET     (API layer — any long random string)
#   wrangler secret put ROCK_ACCESS_HASH   (sha256 hex of the /bri board password)
# Or via the Cloudflare Dashboard → Workers → abf-email-worker → Settings → Variables
# (Migrated from SendGrid to Brevo 2026-07-30 — SendGrid free plan sunset.)

# Rate limiting for the /api layer (namespace created 2026-08-03).
[[kv_namespaces]]
binding = "RATE"
id = "b13b12f9578349ea8bf4a881a5fba51a"

# Non-secret config (visible in dashboard)
[vars]
AIRTABLE_BASE_ID = "appTpp1agJQqoId07"
# Sender must be verified in Brevo. abfresources.com domain authenticated 2026-07-30.
FROM_EMAIL = "noreply@abfresources.com"
FROM_NAME = "LEFC|U ABF"
PORTAL_URL = "https://www.abfresources.com"
DRY_RUN = "false"
BCC_EMAIL = "daly@lefc.net"
# Origins allowed to call the /api layer from a browser.
ALLOWED_ORIGINS = "https://www.abfresources.com,https://abfresources.com"
# Rock Ideas & Feedback board (/bri). This is BOTH the "whole team" list (new-ticket
# emails go to everyone here) AND the allowlist (comment emails can only ever reach
# addresses in this list). Must match the ROSTER in bri/index.html.
ROCK_NOTIFY_EMAILS = "brianna.roberts@lefc.net, e.smith@lefc.net, ethanzook@cedarville.edu, g.poorman@lefc.net, travis@lefc.net, hoover@lefc.net, linsey.smoker@lefc.net, sandy.morris@lefc.net, daly@lefc.net"
